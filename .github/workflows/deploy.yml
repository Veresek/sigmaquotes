name: Deployment

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Create .env files from Secrets
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_KEY }}
                  port: ${{ secrets.DEPLOY_PORT }}
                  script: |
                      cd ./sigmaquotes
                      
                      cat << 'EOF' > .env
                      ${{ secrets.MAIN_ENV_FILE }}
                      EOF
                      
                      mkdir -p bots
                      cat << 'EOF' > bots/.env
                      ${{ secrets.BOTS_ENV_FILE }}
                      EOF

            - name: Deploy containers via Docker Compose
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_KEY }}
                  port: ${{ secrets.DEPLOY_PORT }}
                  script: |
                      cd ./sigmaquotes
                      git pull origin main
                      sudo docker compose up -d --build

            - name: Restart Python Bot via PM2
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_KEY }}
                  port: ${{ secrets.DEPLOY_PORT }}
                  script: |
                      cd ./sigmaquotes/bots
                      if [ ! -d "venv" ]; then
                          python3 -m venv venv
                      fi
                      source venv/bin/activate
                      pip install -r requirements.txt
                      pm2 restart sigmaquotes.py --name "sigmaquotes" --interpreter ./venv/bin/python || pm2 start sigmaquotes.py --name "sigmaquotes" --interpreter ./venv/bin/python
                      pm2 save
